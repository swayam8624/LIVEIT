name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:player
      - run: npm run build:studio
      - name: Bundle native iOS and Android assets
        run: cd apps/player && npx expo export --platform ios --platform android --output-dir ../../dist-native

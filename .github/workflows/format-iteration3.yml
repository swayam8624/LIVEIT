name: Format Iteration 3 Branch
on:
  push:
    branches:
      - feat/liveit-continuous-pixel-life
    paths:
      - docs/ITERATION_03_LIVING_WORLD.md
permissions:
  contents: write
concurrency:
  group: liveit-one-shot-iteration3-format
  cancel-in-progress: false
jobs:
  format-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Normalize tracked repository formatting
        run: npm run format
      - name: Verify exact local command
        run: npm run check
      - name: Commit formatter output to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if git diff --cached --quiet; then
            echo 'Formatting was already current.'
            exit 0
          fi
          git commit -m 'style: format iteration 3 source so local npm run check passes'
          git push origin HEAD:refs/heads/feat/liveit-continuous-pixel-life

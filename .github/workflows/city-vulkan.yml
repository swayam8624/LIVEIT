name: City Vulkan compute smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/city-vulkan/**'
      - '.github/workflows/city-vulkan.yml'
jobs:
  headless-city:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan software ICD, SDK and shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev vulkan-tools mesa-vulkan-drivers glslc
          vulkaninfo --summary || true
      - name: Select Mesa software device when present
        run: |
          if [ -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json ]; then
            echo 'VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json' >> "$GITHUB_ENV"
          fi
      - name: Build shaders and Vulkan renderer
        run: |
          cmake -S native/city-vulkan -B build/city-vulkan -DCMAKE_BUILD_TYPE=Release
          cmake --build build/city-vulkan -j 2
      - name: Render two actual Vulkan-computed city scenes
        run: |
          ctest --test-dir build/city-vulkan --output-on-failure
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          files = [Path('build/city-vulkan/city-day.ppm'), Path('build/city-vulkan/city-night.ppm')]
          for path in files:
              b = path.read_bytes()
              header = b'P6\n256 160\n255\n'
              assert b.startswith(header), f'{path}: invalid PPM header'
              assert len(b) == len(header) + 256*160*3, f'{path}: invalid dimensions'
              assert len(set(b[-256*160*3:])) >= 25, f'{path}: renderer returned flat color'
              print(path, 'SHA-256:', hashlib.sha256(b).hexdigest())
          assert files[0].read_bytes() != files[1].read_bytes(), 'day and night renders must differ'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liveit-vulkan-city-ppm
          path: build/city-vulkan/city-*.ppm
          if-no-files-found: warn

name: City Vulkan compute smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/city-vulkan/**'
      - '.github/workflows/city-vulkan.yml'
jobs:
  headless-city:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan software ICD, SDK and shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev vulkan-tools mesa-vulkan-drivers glslc
          vulkaninfo --summary || true
      - name: Select Mesa software device when present
        run: |
          if [ -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json ]; then
            echo 'VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json' >> "$GITHUB_ENV"
          fi
      - name: Build shaders and Vulkan renderer
        run: |
          cmake -S native/city-vulkan -B build/city-vulkan -DCMAKE_BUILD_TYPE=Release
          cmake --build build/city-vulkan -j 2
      - name: Verify Vulkan world and character rendering, emotions and animation
        run: |
          ctest --test-dir build/city-vulkan --output-on-failure
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          outputs = {
            'city-day.ppm': (256, 160),
            'city-night.ppm': (256, 160),
            'actor-portrait.ppm': (320, 400),
            'actor-emotion.ppm': (320, 400),
            'actor-conversation.ppm': (512, 320),
            'actor-cast.ppm': (512, 320),
            'actor-animation.ppm': (320, 400),
          }
          images = {}
          for name, (w, h) in outputs.items():
              path = Path('build/city-vulkan') / name
              b = path.read_bytes()
              header = f'P6\\n{w} {h}\\n255\\n'.replace('\\n', '\n').encode()
              assert b.startswith(header), f'{path}: invalid PPM header'
              assert len(b) == len(header) + w*h*3, f'{path}: invalid dimensions'
              assert len(set(b[len(header):])) >= 25, f'{path}: renderer returned flat color'
              images[name] = b
              print(path, 'SHA-256:', hashlib.sha256(b).hexdigest())
          assert images['city-day.ppm'] != images['city-night.ppm'], 'lighting must differ'
          assert images['actor-portrait.ppm'] != images['actor-emotion.ppm'], 'emotion must alter actual GPU output'
          assert images['actor-conversation.ppm'] != images['actor-cast.ppm'], 'character count/composition must alter scene'
          assert images['actor-portrait.ppm'] != images['actor-animation.ppm'], 'GPU animation frame must alter pixels'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liveit-vulkan-city-ppm
          path: build/city-vulkan/*.ppm
          if-no-files-found: warn

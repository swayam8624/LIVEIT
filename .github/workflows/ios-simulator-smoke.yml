name: LIVEIT iOS Simulator Native Smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/player/**'
      - 'packages/**'
      - 'content/**'
      - 'package*.json'
      - '.github/workflows/ios-simulator-smoke.yml'
concurrency:
  group: liveit-native-ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-ios:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependency-locked workspace
        run: npm ci
      - name: Select and boot actual simulator
        id: simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available
          UDID=$(python3 - <<'PY'
          import json,subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))
          options=[d for pool in data['devices'].values() for d in pool if d['name'].startswith('iPhone') and d['isAvailable']]
          if not options: raise SystemExit('No available iPhone simulator installed on GitHub runner')
          print(options[0]['udid'])
          PY
          )
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - name: Compile and install native iOS application
        working-directory: apps/player
        shell: bash
        run: |
          set +e
          npx expo run:ios --device "${{ steps.simulator.outputs.udid }}" --no-bundler
          expo_status=$?
          set -e
          if [ "$expo_status" -eq 0 ]; then
            exit 0
          fi
          # Expo CLI can exit after a successful Xcode build because a dev
          # deep-link fails to open (simctl error 60). Never call this success
          # until the compiled app is independently installed and launched.
          if ! grep -q '\*\* BUILD SUCCEEDED \*\*' .expo/xcodebuild.log; then
            echo 'Xcode compilation genuinely failed; preserving the exit code.'
            exit "$expo_status"
          fi
          echo 'Xcode built successfully. Retrying the native app launch without the Expo dev URL.'
          app=''
          while IFS= read -r candidate; do
            id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$candidate/Info.plist" 2>/dev/null || true)
            if [ "$id" = 'studio.livinguniverse.player' ]; then
              app="$candidate"
              break
            fi
          done < <(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphonesimulator/*.app' -type d 2>/dev/null)
          if [ -z "$app" ]; then
            echo 'Build succeeded, but no matching simulator .app could be found.'
            exit "$expo_status"
          fi
          xcrun simctl install "${{ steps.simulator.outputs.udid }}" "$app"
          xcrun simctl launch "${{ steps.simulator.outputs.udid }}" studio.livinguniverse.player
      - name: Print actionable Xcode errors on build failure
        if: failure()
        run: |
          if [ -f apps/player/.expo/xcodebuild.log ]; then
            echo '--- Xcode warnings/errors ---'
            grep -Ein -C 3 'error:|Could not resolve|failed|fatal error|timed out|permission denied' apps/player/.expo/xcodebuild.log | tail -150 || true
            echo '--- Last 100 Xcode log lines ---'
            tail -100 apps/player/.expo/xcodebuild.log
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-ios-xcode-diagnostic
          path: apps/player/.expo/xcodebuild.log
          if-no-files-found: warn
      - name: Verify bundle launches and capture evidence
        run: |
          xcrun simctl launch "${{ steps.simulator.outputs.udid }}" studio.livinguniverse.player
          xcrun simctl io "${{ steps.simulator.outputs.udid }}" screenshot native-ios-smoke.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liveit-native-ios-evidence
          path: native-ios-smoke.png
          if-no-files-found: ignore
